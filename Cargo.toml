[package]
name = "img2svg"
version = "0.1.12"
edition = "2024"
description = "High-performance Rust image-to-SVG converter: vectorize PNG, JPEG, GIF, WebP, BMP, TIFF to scalable SVG with cubic Bezier curves, edge-aware k-means quantization, and Potrace-style optimization. Use as a CLI tool, Rust library, or MCP server for AI assistants."
authors = ["Ying Kit WONG"]
license = "Apache-2.0"
documentation = "https://docs.rs/img2svg"
repository = "https://github.com/yingkitw/img2svg"
homepage = "https://github.com/yingkitw/img2svg"
readme = "README.md"
categories = ["graphics", "multimedia", "image-processing", "command-line-utilities", "visualization"]
keywords = ["svg", "vectorization", "raster-to-vector", "image-conversion", "mcp"]
default-run = "img2svg"
exclude = [
    ".github",
    "examples/input",
    "examples/output",
    "examples/comparison.html",
    "generate_test_images.py",
    "*.png",
    "*.jpg",
    "*.svg",
    "*.html",
]

[dependencies]
image = "0.24"
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", optional = true, features = ["derive"] }
serde_json = { version = "1.0", optional = true }
svg = "0.13"
rgb = "0.8"
thiserror = "1.0"
anyhow = "1.0"
rayon = "1.10"
rand = "0.10"

[features]
default = []
# Enables MCP server dependencies (serde, serde_json). Required by the
# img2svg-mcp binary.
mcp = ["dep:serde", "dep:serde_json"]

[lib]
name = "img2svg"
path = "src/lib.rs"

[[bin]]
name = "img2svg"
path = "src/main.rs"

[[bin]]
name = "img2svg-mcp"
path = "src/mcp.rs"
required-features = ["mcp"]

# Strip release binaries and optimize for size where the speed tradeoff is
# acceptable. `opt-level = 3` keeps the vectorization pipeline fast; the
# `strip = true` and LTO reduce the binary footprint for distribution.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[[bench]]
name = "pipeline_comparison"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
